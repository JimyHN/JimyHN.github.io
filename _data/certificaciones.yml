obtenidas:
  - nombre: "eJPT"
    color: "94 180 248"
    estado_label: "Obtenida"
    emisor: "INE Security"
    logo: "/assets/img/logos/ine.png"
    fecha: "Agosto 2026"
    documento: "/assets/docs/ejpt.pdf"
    preview: "/assets/img/docs-preview/ejpt.png"
    resumen: >-
      Mi primera certificación ofensiva. El examen es un laboratorio real en el que hay que
      comprometer una red entera y responder a preguntas sobre lo que vas encontrando, así
      que no vale con memorizar: hay que saber enumerar, explotar y moverse de verdad.
    habilidades: ["Enumeración de redes", "Explotación web", "Metasploit", "Pivoting", "Post-explotación", "Reporting"]

en_progreso:
  - nombre: "OSCP"
    color: "130 140 255"
    estado_label: "En curso"
    emisor: "OffSec"
    logo: "/assets/img/logos/offsec.jpeg"
    resumen: >-
      El objetivo que tengo ahora mismo entre ceja y ceja. Examen práctico de 24 horas en el
      que hay que comprometer varias máquinas y entregar después un informe en condiciones.
      Todo lo que subo al Roadmap es parte de esta preparación.
    habilidades: ["Explotación manual", "Active Directory", "Escalada en Windows", "Escalada en Linux", "Pivoting", "Reporting"]
