# Lista de TJnull para la OSCP (versión ordenada por dificultad de Shellshock9001)
# Fuente: https://github.com/Shellshock9001/Tjs-Nulls-OSCP-list-in-order-from-easy-medium-hard-insane-more-challenging-and-alphabetical
# (PDF "Tj Null's OSCP LIST", agosto de 2022). Nombres corregidos a su forma oficial en HackTheBox.
#
# Campos por máquina: name, os, difficulty y status (opcional: Pendiente | En curso | Resuelta).
# Si existe un post con `machine: <name>` y `platform: HackTheBox`, se enlaza solo y se marca como Resuelta.

