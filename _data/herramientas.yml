# Herramientas propias. Cada una se despliega al pulsarla.
- nombre: "Bash_Decompressor"
  lenguaje: "Bash"
  color: "255 120 60"
  icono: "fas fa-box-open"
  repo: "https://github.com/JimyHN/Bash_Decompressor"
  resumen: >-
    Descompresor recursivo en Bash. Detecta y extrae automáticamente archivos
    comprimidos anidados unos dentro de otros, por muchas capas que tengan, hasta
    dejar todo el contenido final a la vista. Muy útil en CTFs con "matrioskas" de
    ficheros comprimidos.
  tags: [bash, automatización, ctf]
- nombre: "goto-fzf"
  lenguaje: "Bash"
  color: "46 230 214"
  icono: "fas fa-location-crosshairs"
  repo: "https://github.com/JimyHN/goto-fzf"
  resumen: >-
    Utilidad para Linux que busca un archivo o directorio y te lleva directamente a
    su ubicación, apoyándose en fzf para el filtrado interactivo. Se acabó el
    encadenar find y cd: buscas, eliges y ya estás dentro.
  tags: [bash, fzf, productividad]
